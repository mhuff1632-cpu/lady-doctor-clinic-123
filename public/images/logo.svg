<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ldc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="ldc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="ldc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#881337" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle with shadow -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#ldc-grad)" filter="url(#shadow)" />
  <rect x="10" y="10" width="100" height="100" rx="26" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Stylized Medical Cross (Softly rounded) -->
  <rect x="52" y="26" width="16" height="68" rx="8" fill="#ffffff" opacity="0.95" />
  <rect x="26" y="52" width="68" height="16" rx="8" fill="#ffffff" opacity="0.95" />

  <!-- Heart / Maternal Care Silhouette embracing center -->
  <path d="M60 76 C60 76, 36 60, 36 44 C36 34, 44 28, 52 32 C56 34, 59 38, 60 41 C61 38, 64 34, 68 32 C76 28, 84 34, 84 44 C84 60, 60 76, 60 76 Z" 
        fill="url(#ldc-accent)" 
        opacity="0.85" />

  <!-- Inner Medical Cross Accent -->
  <circle cx="60" cy="50" r="7" fill="#ffffff" />
  <circle cx="60" cy="50" r="4.5" fill="url(#ldc-gold)" />

  <!-- Small Stethoscope / Vitality Sparkle Dot -->
  <circle cx="78" cy="30" r="3.5" fill="#ffffff" opacity="0.9" />
</svg>
